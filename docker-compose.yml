services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: auditagov
      POSTGRES_USER: auditagov
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auditagov -d auditagov"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auditagov
      SPRING_DATASOURCE_USERNAME: auditagov
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      AUDITA_DEMO_JWT_SECRET: ${AUDITA_DEMO_JWT_SECRET:?Set AUDITA_DEMO_JWT_SECRET to at least 32 characters}
      AUDITA_DEMO_PASSWORDS_INGESTOR: ${AUDITA_DEMO_PASSWORDS_INGESTOR:?Set AUDITA_DEMO_PASSWORDS_INGESTOR}
      AUDITA_DEMO_PASSWORDS_AUDITOR: ${AUDITA_DEMO_PASSWORDS_AUDITOR:?Set AUDITA_DEMO_PASSWORDS_AUDITOR}
      AUDITA_DEMO_PASSWORDS_ADMIN: ${AUDITA_DEMO_PASSWORDS_ADMIN:?Set AUDITA_DEMO_PASSWORDS_ADMIN}
    ports:
      - "${AUDITAGOV_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres-data:
